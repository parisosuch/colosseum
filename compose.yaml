# The whole app: `docker compose up -d` boots Postgres, migrates the schema,
# and serves. Upgrading is `docker compose pull && docker compose up -d` —
# migrations run on boot, before the server accepts traffic.
#
# Set AUTH_SECRET (and optionally POSTGRES_PASSWORD) in a `.env` file next to
# this compose file. Generate one with: openssl rand -base64 32

services:
  app:
    # Pin a real version when pulling from a registry — never :latest, or
    # `compose pull` upgrades you blind. `build:` lets a checkout build the
    # same image locally with `docker compose up --build`.
    image: colosseum:0.1.0
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      AUTH_SECRET: ${AUTH_SECRET:?generate with `openssl rand -base64 32`}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "3000:3000"
    # Chromium (screenshot capture) crashes on the 64MB /dev/shm default.
    shm_size: 1gb
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db:
  storage:
