# The whole app: `docker compose up -d --build` builds from source, boots
# Postgres, migrates the schema, and serves. Upgrading is
# `git pull && docker compose up -d --build` — migrations run on boot, before
# the server accepts traffic.
#
# Set AUTH_SECRET (and optionally POSTGRES_PASSWORD) in a `.env` file next to
# this compose file. Generate one with: openssl rand -base64 32

services:
  app:
    # Built from this checkout — there is no published image to pull.
    image: colosseum:local
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      AUTH_SECRET: ${AUTH_SECRET:?generate with `openssl rand -base64 32`}
      # Better Auth checks the request's Origin against this; behind a real
      # domain it must be that public URL or sign-in/sign-up gets a 403
      # "Invalid origin".
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      STORAGE_DIR: /data/storage
      # Optional Redis cache. Empty unless set in `.env`, which keeps caching
      # off (the app queries Postgres directly). To enable, start the stack with
      # the `cache` profile and set REDIS_URL — see the redis service below.
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CACHE_ENABLED: ${REDIS_CACHE_ENABLED:-}
    volumes:
      - storage:/data/storage
    ports:
      - "3000:3000"
    # Chromium (screenshot capture) crashes on the 64MB /dev/shm default.
    shm_size: 1gb
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback-only host access: local dev (bun run db:*) and pg_dump both
    # reach Postgres at 127.0.0.1:54322 without exposing it off-machine.
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional cache, off by default. It only starts under the `cache` profile
  # (`docker compose --profile cache up -d --build`); a plain `up` runs just app
  # + db. Data is ephemeral on purpose — it's a cache, so nothing here needs to
  # survive a restart. Reachable from `app` at redis://redis:6379 on the compose
  # network; set REDIS_URL to that in `.env` to turn caching on.
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    restart: unless-stopped

volumes:
  db:
  storage:
