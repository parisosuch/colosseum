# The whole app: `docker compose up -d --build` builds from source, boots
# Postgres, migrates the schema, and serves. Upgrading is
# `git pull && docker compose up -d --build` — migrations run on boot, before
# the server accepts traffic.
#
# Set AUTH_SECRET (and optionally POSTGRES_PASSWORD) in a `.env` file next to
# this compose file. Generate one with: openssl rand -base64 32

services:
  app:
    # Built from this checkout — there is no published image to pull.
    image: colosseum:local
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      AUTH_SECRET: ${AUTH_SECRET:?generate with `openssl rand -base64 32`}
      # Better Auth checks the request's Origin against this; behind a real
      # domain it must be that public URL or sign-in/sign-up gets a 403
      # "Invalid origin".
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      STORAGE_DIR: /data/storage
      # Optional S3-compatible blob storage (AWS S3, Cloudflare R2, MinIO). Unset
      # by default → blobs stay on the local `storage` volume. Set S3_BUCKET (and
      # the rest) in `.env` to switch every blob operation to the bucket. See the
      # "S3 / CDN storage" section in the README and `.env.example`.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Public CDN/edge base URL in front of the bucket (optional; needs S3).
      CDN_URL: ${CDN_URL:-}
      # Runtime toggles, read at request time so they can change without a
      # rebuild. Unset → their in-app defaults (sign-ups open; 100 req / 60s).
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-}
      API_RATE_WINDOW_MS: ${API_RATE_WINDOW_MS:-}
    volumes:
      - storage:/data/storage
    ports:
      - "3000:3000"
    # Chromium (screenshot capture) crashes on the 64MB /dev/shm default.
    shm_size: 1gb
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback-only host access: local dev (bun run db:*) and pg_dump both
    # reach Postgres at 127.0.0.1:54322 without exposing it off-machine.
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db:
  storage:
